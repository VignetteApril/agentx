[package]
name = "agentx-desktop"
version = "0.5.3"
edition = "2021"
description = "Native account tabs around independently signed-in official Codex clients"
publish = false

[[bin]]
name = "AgentX"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
  "Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem",
  "Win32_System_Threading", "Win32_System_LibraryLoader",
  "Win32_System_DataExchange", "Win32_System_Memory", "Win32_System_Console", "Win32_System_SystemServices",
  "Win32_System_SystemInformation",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging", "Win32_UI_Controls", "Win32_UI_Controls_Dialogs",
  "Win32_UI_Shell", "Win32_UI_HiDpi", "Win32_Graphics_Gdi", "Win32_Graphics_Dwm",
] }

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
